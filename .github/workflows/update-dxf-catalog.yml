name: Aktualizace DXF katalogu

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-dxf-catalog.cjs"
      - ".github/workflows/update-dxf-catalog.yml"

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Stáhnout aktuální katalog DXF
        run: node scripts/update-dxf-catalog.cjs

      - name: Kontrola výsledku
        run: |
          node -e "const x=require('./dxf-catalog.json'); if(!x.products || x.products.length<20) throw new Error('Katalog je podezřele malý: '+(x.products?.length||0)); console.log('Produkty:',x.products.length)"
          grep -q '"sourceWarehouse"' dxf-catalog.json
          grep -q '"productUrl"' dxf-catalog.json
          grep -q '"imageUrl"' dxf-catalog.json

      - name: Commitnout změny katalogu
        run: |
          if git diff --quiet -- dxf-catalog.json; then
            echo "Katalog beze změny."
            exit 0
          fi
          git config user.name "DXF Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add dxf-catalog.json
          git commit -m "Automatická aktualizace DXF katalogu"
          git push
